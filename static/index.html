<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DocsGPT — FastAPI RAG Assistant</title>
<style>
  :root {
    --bg: #0f1117; --panel: #171a21; --border: #262b36;
    --text: #e6e8ec; --muted: #9aa2b1; --accent: #4f9cf9; --accent-2: #10b981;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--bg); color: var(--text); height: 100vh; display: flex;
    flex-direction: column; align-items: center;
  }
  header {
    width: 100%; padding: 18px 24px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px;
  }
  header h1 { font-size: 18px; margin: 0; font-weight: 600; }
  header .badge {
    font-size: 12px; color: var(--muted); border: 1px solid var(--border);
    padding: 2px 8px; border-radius: 999px;
  }
  main {
    width: 100%; max-width: 820px; flex: 1; overflow-y: auto;
    padding: 24px; display: flex; flex-direction: column; gap: 18px;
  }
  .msg { display: flex; flex-direction: column; gap: 6px; }
  .msg .role { font-size: 12px; color: var(--muted); }
  .bubble {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; padding: 14px 16px; white-space: pre-wrap;
    line-height: 1.55; word-wrap: break-word;
  }
  .bubble.user { background: #1c2530; border-color: #2b3a4d; }
  .citations { margin-top: 8px; display: flex; flex-direction: column; gap: 4px; }
  .citations a { color: var(--accent); font-size: 13px; text-decoration: none; }
  .citations a:hover { text-decoration: underline; }
  .citations .label { font-size: 12px; color: var(--muted); }
  footer { width: 100%; max-width: 820px; padding: 16px 24px 24px; }
  form { display: flex; gap: 10px; }
  input[type=text] {
    flex: 1; background: var(--panel); border: 1px solid var(--border);
    color: var(--text); border-radius: 10px; padding: 12px 14px; font-size: 15px;
  }
  input[type=text]:focus { outline: none; border-color: var(--accent); }
  button {
    background: var(--accent); color: #fff; border: none; border-radius: 10px;
    padding: 0 20px; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .empty { color: var(--muted); text-align: center; margin-top: 40px; }
</style>
</head>
<body>
  <header>
    <h1>DocsGPT</h1>
    <span class="badge">FastAPI docs + GitHub issues · RAG</span>
  </header>
  <main id="chat">
    <div class="empty" id="empty">Ask anything about FastAPI. Answers are grounded in the docs, with citations.</div>
  </main>
  <footer>
    <form id="form">
      <input type="text" id="q" placeholder="e.g. How do I declare a path parameter?" autocomplete="off" />
      <button type="submit" id="send">Ask</button>
    </form>
  </footer>

<script>
  const chat = document.getElementById("chat");
  const form = document.getElementById("form");
  const input = document.getElementById("q");
  const send = document.getElementById("send");
  const empty = document.getElementById("empty");

  function addMessage(role, text, citations) {
    if (empty) empty.remove();
    const wrap = document.createElement("div");
    wrap.className = "msg";
    const r = document.createElement("div");
    r.className = "role";
    r.textContent = role === "user" ? "You" : "DocsGPT";
    const b = document.createElement("div");
    b.className = "bubble " + role;
    b.textContent = text;
    wrap.appendChild(r);
    wrap.appendChild(b);
    if (citations && citations.length) {
      const c = document.createElement("div");
      c.className = "citations";
      const lbl = document.createElement("div");
      lbl.className = "label";
      lbl.textContent = "Sources:";
      c.appendChild(lbl);
      citations.forEach((cit) => {
        const a = document.createElement("a");
        a.href = cit.url; a.target = "_blank";
        a.textContent = `[${cit.id}] ${cit.title || cit.url}`;
        c.appendChild(a);
      });
      wrap.appendChild(c);
    }
    chat.appendChild(wrap);
    chat.scrollTop = chat.scrollHeight;
    return b;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const question = input.value.trim();
    if (!question) return;
    addMessage("user", question);
    input.value = "";
    send.disabled = true;
    const thinking = addMessage("assistant", "Thinking…");
    try {
      const res = await fetch("/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question }),
      });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      thinking.parentElement.remove();
      addMessage("assistant", data.answer, data.citations);
    } catch (err) {
      thinking.textContent = "Error: " + err.message;
    } finally {
      send.disabled = false;
      input.focus();
    }
  });
</script>
</body>
</html>
